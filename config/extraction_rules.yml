version: "extraction_rules.2026-05-11"

fields:
  symptom:
    patterns:
      - '[^.。]*(?:500 에러|오류|버그|장애|안 됩니다|안됨|빈 화면|timeout|invalid token|403|Forbidden|로그인할 수 없습니다|서버 예외)[^.。]*'
      - '[^.。]*(?:latency|5초 이상|응답 시간이 \d+초 이상)[^.。]*'
      - '[^.。]*(?:응답 시간이 \d+초 이상|실패율이 [^.。]+)[^.。]*'

  affected_customer_or_user:
    patterns:
      - '[A-Z] 고객사'
      - '전체 고객'
      - '고객들?'
      - '사용자'
      - '전체 트래픽'
      - '전체 요청'
      - '모든 승인 요청'

  impact_scope:
    patterns:
      - '전체 [^.。]*(?:\d+%|고객|요청|트래픽)?'
      - '\d+%[^.。]*'
      - '모든 [^.。]*(?:요청|고객|결제)'
      - '모든 승인 요청'
      - '전체 트래픽의 \d+%'

  reproduction_steps:
    patterns:
      - '[^.。]*(?:클릭|후|직후|에서만 재현|재현되고)[^.。]*'

  first_seen_at:
    patterns:
      - '어제'
      - '오늘'
      - '이번 주'
      - '지난 \d+월'

  environment:
    patterns:
      - 'us-east'
      - '특정 브라우저'
      - '브라우저'
      - 'API'
      - '리전'

  dataset_or_metric:
    skip_contains:
      - '지난번 데이터'
    skip_exact:
      - '데이터 추출 부탁드립니다.'
      - '데이터 추출 부탁드립니다'
    patterns:
      - '지난 \d+월 [^.。]*(?:가입자 수|전환율)'
      - '이번 (?:달|주) [^.。]*(?:데이터|리포트)'
      - '월간 [^.。]*대시보드'
      - '팀별 [^.。]*대시보드'
      - '팀별 주간 처리 건수 대시보드'
      - '고객사별 [^.。]*데이터'
      - '캠페인별 [^.。]*리포트'
      - '[^.。]*(?:Excel|CSV|export|column group)[^.。]*'
      - '[^.。]*(?:가입자 수|전환율|사용량 데이터|매출 리포트|처리 건수 대시보드)[^.。]*'

  purpose:
    patterns:
      - '[^.。]*(?:회의|리뷰|분석|회고|PM 리뷰|마케팅 회의|재계약 분석)[^.。]*'
      - '[^.。]*분석용[^.。]*'
      - '[^.。]*(?:필요합니다|쓰려고 합니다)[^.。]*'

  deadline:
    patterns:
      - '오늘 중'
      - '오늘'
      - '내일까지'
      - '이번 주 금요일까지'
      - '다음 주 월요일까지'
      - '월간'
      - '주간'
      - '이번 달'
      - '이번 주'

  format:
    patterns:
      - 'CSV'
      - 'PDF'
      - 'csv'
      - 'pdf'

  user_need:
    patterns:
      - '[^.。]*(?:기능|개선|옵션|필터|템플릿|추가)[^.。]*'
      - '[^.。]*(?:정렬|최신순|위젯|목표 대비|달성률)[^.。]*'
      - '[^.。]*(?:있으면 좋겠습니다|하고 싶습니다)[^.。]*'

  expected_outcome:
    patterns:
      - '[^.。]*(?:필요합니다|있으면 좋겠습니다|보고 싶어합니다|개선할 수 있을까요|적용되면 좋겠습니다|설정할 수 있게)[^.。]*'
      - '[^.。]*(?:한눈에 볼 수 있으면 좋겠습니다)[^.。]*'
      - '[^.。]*(?:목표 대비|달성률|위젯|추가하고 싶습니다)[^.。]*'

  priority_reason:
    patterns:
      - '급해요'
      - '오늘 중'
      - '배포 전에'
      - 'enterprise'

  customer:
    patterns:
      - '[A-Z] 고객사'
      - '고객'

  issue_detail:
    patterns:
      - '[^.。]*(?:문의|요청|안 온다고|오류|상태|결제 취소)[^.。]*'

  required_action:
    patterns:
      - '[^.。]*(?:확인|알려|연락|답변)[^.。]*'

  contact_channel:
    patterns:
      - '010-?\d{3,4}-?\d{4}'
      - '@[A-Za-z0-9._-]+'

  approval_target:
    patterns:
      - '환불 처리 승인'
      - '결제 취소'
      - '승인'
      - '결재'
      - '권한'

  scope_or_amount:
    patterns:
      - '\d+\s*만원'
      - '\d+개'

  approval_owner:
    patterns:
      - '보안팀'
      - '승인권자'
      - '관리자 승인'

  requested_action:
    patterns:
      - '계정 생성'
      - '권한 [^.。]*(?:열어|부여|설정)'
      - '삭제'
      - '온보딩'
      - 'GitHub에 올려'

  target_user_or_system:
    patterns:
      - '김대리님 계정'
      - '신규 온보딩 대상자 \d+명'
      - '운영 데이터'
      - '테스트 계정 \d+개'
      - 'GitHub'
