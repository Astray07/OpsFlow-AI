version: "privacy_rules.2026-05-11"

masking:
  email:
    pattern: "[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\\.[A-Za-z]{2,}"
    replacement: "[EMAIL]"
  phone:
    pattern: "(01[016789])-?\\d{3,4}-?\\d{4}"
    replacement: "[PHONE]"
  rrn_like:
    pattern: "\\d{6}-\\d{7}"
    replacement: "[ID_NUMBER]"
  order_id:
    pattern: "(ORD|ORDER)-\\d+"
    replacement: "[ORDER_ID]"
  person:
    # v0.3 placeholder. Korean person-name masking is intentionally disabled until
    # precision is evaluated to avoid over-masking generic role titles.
    enabled: false
    pattern: "[가-힣]{2,4}(?:님|대리|과장|차장|부장)"
    replacement: "[PERSON]"

policy:
  # Enforced by the pipeline: PII raises at least medium risk.
  pii_detected_min_risk_level: medium
  # Enforced by LLM assist input selection.
  send_raw_text_to_llm: false
  # Local outputs are gitignored; external/shared artifacts should use masked fields.
  store_raw_text_local_only: true
  # v0.3 placeholder. Concrete person masking rules are disabled above.
  person_masking: "v2"
